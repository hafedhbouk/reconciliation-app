services:
  # PHP-FPM + Nginx + Supervisor (main application)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: reconciliation-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-reconciliation_app}
      - DB_USERNAME=${DB_USERNAME:-reconciliation}
      - DB_PASSWORD=${DB_PASSWORD}
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - SESSION_DRIVER=database
      - MAIL_MAILER=${MAIL_MAILER:-log}
    volumes:
      - app-storage:/var/www/html/storage/app
      - app-public:/var/www/html/storage/app/public
    networks:
      - reconciliation-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: reconciliation-mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-reconciliation_app}
      - MYSQL_USER=${DB_USERNAME:-reconciliation}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - reconciliation-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

  # Queue Worker (for background jobs)
  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: reconciliation-queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--memory=1024", "--timeout=0"]
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-reconciliation_app}
      - DB_USERNAME=${DB_USERNAME:-reconciliation}
      - DB_PASSWORD=${DB_PASSWORD}
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - SESSION_DRIVER=database
    volumes:
      - app-storage:/var/www/html/storage/app
    networks:
      - reconciliation-network
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Scheduler (for Laravel task scheduling)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: reconciliation-scheduler
    restart: unless-stopped
    command: ["sh", "-c", "while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-reconciliation_app}
      - DB_USERNAME=${DB_USERNAME:-reconciliation}
      - DB_PASSWORD=${DB_PASSWORD}
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - SESSION_DRIVER=database
    volumes:
      - app-storage:/var/www/html/storage/app
    networks:
      - reconciliation-network
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_healthy

networks:
  reconciliation-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  app-storage:
    driver: local
  app-public:
    driver: local
